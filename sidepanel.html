<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Space</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="sidepanel.css?v=19">
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="space-heading">
          <h1 id="activeSpaceName">Space</h1>
          <p id="syncStatus">Loading tabs</p>
        </div>
        <div class="top-actions" aria-label="Actions">
          <button class="icon-button compact" id="tidyNamesButton" title="Tidy names" aria-label="Tidy Names">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
          </button>
          <button class="icon-button compact" id="autoGroupButton" title="Auto group" aria-label="Auto Group">
            <svg class="archive-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5.5 8.5h13l1.4 4.2v4.8a1.5 1.5 0 0 1-1.5 1.5H5.6a1.5 1.5 0 0 1-1.5-1.5v-4.8L5.5 8.5Z"></path>
              <path d="M7.4 5.5h9.2a1.4 1.4 0 0 1 1.3.9l.8 2.1H5.3l.8-2.1a1.4 1.4 0 0 1 1.3-.9Z"></path>
              <path d="M9 12.7h6"></path>
            </svg>
          </button>
          <button class="icon-button compact" id="collapseGroupsButton" title="Collapse groups" aria-label="Collapse groups">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
          </button>
          <button class="icon-button compact" id="settingsButton" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          </button>
        </div>
      </header>

      <main class="space-view" id="groupsList"></main>

      <main class="context-view" id="contextView" hidden>
        <div class="context-toolbar">
          <span id="contextStatus">Saved locally</span>
          <button class="icon-button compact" type="button" id="clearContextButton" title="Clear Context" aria-label="Clear Context">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="m19 6-1 14H6L5 6"></path><path d="M10 11v5"></path><path d="M14 11v5"></path></svg>
          </button>
        </div>
        <textarea class="context-editor" id="spaceContextInput" spellcheck="true" placeholder="# Outcome&#10;&#10;## Notes&#10;&#10;## Decisions&#10;&#10;## Next actions"></textarea>
      </main>

      <main class="ask-view" id="askPageView" hidden>
        <div class="ask-scope" id="askScope"></div>
        <div class="ask-messages" id="askMessages"></div>
        <textarea id="askPagePrompt" rows="4" placeholder="Ask this Space"></textarea>
        <div class="ai-actions">
          <button id="askAIButton">Ask</button>
          <button id="summarizePageButton">Summarize page</button>
        </div>
      </main>

      <nav class="space-dock" id="spacesList" aria-label="Spaces"></nav>
      <div class="context-menu" id="contextMenu" hidden></div>
    </div>

    <dialog id="actionDialog">
      <form class="action-form">
        <div class="dialog-title">
          <h2 id="actionDialogTitle">Action</h2>
          <button class="icon-button" type="button" id="actionDialogClose" aria-label="Close dialog">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        <p id="actionDialogMessage" class="action-message"></p>
        <label id="actionDialogLabel" class="action-label">
          Name
          <input id="actionDialogInput" type="text" autocomplete="off" spellcheck="false">
        </label>
        <div class="action-buttons">
          <button type="button" id="actionDialogCancel">Cancel</button>
          <button type="submit" id="actionDialogConfirm">Save</button>
        </div>
      </form>
    </dialog>

    <dialog id="settingsDialog">
      <form method="dialog" class="settings">
        <div class="dialog-title">
          <h2>Settings</h2>
          <button class="icon-button" value="cancel" aria-label="Close settings">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        <label>
          Theme Color
          <div class="theme-options">
            <button type="button" class="theme-option purple" data-theme="purple" title="Purple Nebula" aria-label="Purple Nebula"></button>
            <button type="button" class="theme-option emerald" data-theme="emerald" title="Forest Emerald" aria-label="Forest Emerald"></button>
            <button type="button" class="theme-option ocean" data-theme="ocean" title="Ocean Breeze" aria-label="Ocean Breeze"></button>
            <button type="button" class="theme-option sunset" data-theme="sunset" title="Sunset Rose" aria-label="Sunset Rose"></button>
            <button type="button" class="theme-option amber" data-theme="amber" title="Solar Amber" aria-label="Solar Amber"></button>
            <button type="button" class="theme-option slate" data-theme="slate" title="Nordic Slate" aria-label="Nordic Slate"></button>
          </div>
        </label>
        <label>
          Provider
          <select id="providerInput"></select>
        </label>
        <label>
          Base URL
          <input id="baseUrlInput" type="url" spellcheck="false">
        </label>
        <label>
          Model
          <select id="modelInput"></select>
        </label>
        <label id="customModelLabel" hidden>
          Custom Model
          <input id="customModelInput" type="text" spellcheck="false">
        </label>
        <label>
          Language
          <select id="languageInput">
            <option value="zh-CN">Chinese (Simplified)</option>
            <option value="en">English</option>
            <option value="auto">Auto</option>
          </select>
        </label>
        <label>
          API Key
          <input id="apiKeyInput" type="password" autocomplete="off" spellcheck="false">
        </label>
        <div class="api-key-state">
          <span id="apiKeyStatus">No API key configured.</span>
          <button type="button" id="clearApiKeyButton" class="link-button">Clear API key</button>
        </div>
        <div class="form-grid">
          <label>
            Thinking
            <select id="thinkingInput">
              <option value="disabled">Disabled</option>
              <option value="enabled">Enabled</option>
            </select>
          </label>
          <label>
            Max tokens
            <input id="maxTokensInput" type="number" min="256" max="32768" step="256">
          </label>
        </div>
        <button type="button" id="testAIButton" class="secondary-button">Test AI</button>
        <div id="settingsStatus" class="settings-status">AI status appears here.</div>
        <section class="space-data-settings">
          <h3>Space Data</h3>
          <button type="button" id="exportSpaceDataButton" class="secondary-button">Export Backup</button>
          <label class="file-picker">
            <input id="spaceBackupInput" type="file" accept=".json,application/json">
          </label>
          <button type="button" id="restoreSpaceDataButton" class="secondary-button" disabled>Restore Backup</button>
          <div id="spaceBackupStatus" class="settings-status">No backup selected.</div>
        </section>
        <section class="arc-import-settings">
          <h3>Arc Import</h3>
          <p>Select Arc's <code>StorableSidebar.json</code>.</p>
          <label class="file-picker">
            <input id="arcImportInput" type="file" accept=".json,application/json">
          </label>
          <button type="button" id="importArcButton" class="secondary-button" disabled>Append Import</button>
          <div id="arcImportStatus" class="settings-status">No Arc file selected.</div>
        </section>
        <section class="shortcut-settings">
          <h3>Panel Shortcuts</h3>
          <div id="shortcutsList" class="shortcuts-list"></div>
        </section>
        <menu>
          <button value="cancel">Cancel</button>
          <button id="saveSettingsButton" value="default">Save</button>
        </menu>
      </form>
    </dialog>

    <script src="config.local.js"></script>
    <script type="module" src="sidepanel.js?v=19"></script>
  </body>
</html>
